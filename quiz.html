<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trang Làm bài - Adaptive Quiz System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="min-h-screen flex flex-col">

  <!-- Header dùng chung -->
  <header class="sticky top-0 z-30 bg-white/95 backdrop-blur border-b border-slate-200 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center text-white shadow-md shadow-indigo-200">
          <i class="fa-solid fa-brain text-lg"></i>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <span class="text-xs font-bold uppercase tracking-wider text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded">HỆ THỐNG LUYỆN TẬP TRỰC TUYẾN</span>
            <span class="text-xs text-slate-400 hidden sm:inline">Học phần Thiết kế Web</span>
          </div>
          <h1 class="text-base sm:text-lg font-extrabold text-slate-900 leading-tight">Adaptive Quiz System</h1>
        </div>
      </div>

      <nav class="flex items-center gap-1 bg-slate-100 p-1 rounded-xl border border-slate-200/80">
        <a href="index.html" class="px-3 py-1.5 rounded-lg text-xs sm:text-sm font-semibold text-slate-600 hover:text-slate-900 flex items-center gap-1.5">
          <i class="fa-solid fa-layer-group"></i>
          <span>1. Danh sách đề thi</span>
        </a>
        <a href="quiz.html" class="px-3 py-1.5 rounded-lg text-xs sm:text-sm font-semibold bg-white text-indigo-600 shadow-sm flex items-center gap-1.5">
          <i class="fa-solid fa-pen-to-square"></i>
          <span>2. Trang Làm bài</span>
        </a>
        <a href="result.html" class="px-3 py-1.5 rounded-lg text-xs sm:text-sm font-semibold text-slate-600 hover:text-slate-900 flex items-center gap-1.5">
          <i class="fa-solid fa-chart-pie"></i>
          <span>3. Trang Kết quả</span>
        </a>
      </nav>

      <button onclick="openJsonModal()" class="hidden md:flex items-center gap-1.5 text-xs font-semibold px-3 py-2 rounded-lg bg-slate-900 text-white hover:bg-slate-800 transition">
        <i class="fa-solid fa-file-code text-indigo-400"></i>
        <span>Xem dữ liệu JSON</span>
      </button>
    </div>
  </header>

  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8">
    <!-- Thanh trạng thái Đề thi, Progress Bar & Đồng hồ đếm ngược -->
    <div class="bg-white rounded-2xl p-4 sm:p-5 border border-slate-200 shadow-sm mb-6">
      <div class="flex flex-wrap items-center justify-between gap-4 mb-3">
        <div>
          <span id="quiz-topic-badge" class="text-xs font-bold text-indigo-600 uppercase tracking-wider">CHỦ ĐỀ</span>
          <h2 id="quiz-active-title" class="text-lg sm:text-xl font-extrabold text-slate-900">Tên đề thi</h2>
        </div>

        <div class="flex items-center gap-3">
          <div class="px-3 py-1.5 rounded-xl bg-amber-50 border border-amber-200 text-amber-800 text-xs font-semibold flex items-center gap-1.5">
            <i class="fa-solid fa-eye"></i>
            <span>Rời tab: <strong id="tab-switch-count">0</strong> lần</span>
          </div>

          <div id="timer-box" class="flex items-center gap-2 px-4 py-2 rounded-xl bg-slate-900 text-white font-mono-code text-sm sm:text-base font-bold">
            <i class="fa-regular fa-clock text-indigo-400"></i>
            <span id="countdown-display">05:00</span>
          </div>
        </div>
      </div>

      <!-- Thanh tiến độ (Progress Bar) -->
      <div class="flex items-center justify-between text-xs font-semibold text-slate-500 mb-1.5">
        <span id="progress-label">Tiến độ: Câu 1 / 6</span>
        <span id="answered-count-label">Đã trả lời: 0/6 câu (0%)</span>
      </div>
      <div class="w-full h-2.5 bg-slate-100 rounded-full overflow-hidden border border-slate-200/60">
        <div id="quiz-progress-bar" class="h-full bg-gradient-to-r from-indigo-600 to-violet-600 rounded-full progress-transition" style="width: 0%"></div>
      </div>
    </div>

    <!-- Khung làm bài 2 cột -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
      <div class="lg:col-span-8 bg-white rounded-2xl p-6 sm:p-8 border border-slate-200 shadow-sm">
        <div class="flex flex-wrap items-center justify-between gap-2 pb-4 mb-5 border-b border-slate-100">
          <div class="flex items-center gap-2">
            <span id="q-number-badge" class="px-3 py-1 rounded-lg bg-indigo-600 text-white font-bold text-xs">Câu 1</span>
            <span id="q-skill-badge" class="px-3 py-1 rounded-lg bg-slate-100 text-slate-700 font-semibold text-xs">Kỹ năng</span>
          </div>
          <span id="q-type-badge" class="text-xs font-semibold px-2.5 py-1 rounded-md bg-blue-50 text-blue-700 border border-blue-200">
            Chọn 1 đáp án (Radio)
          </span>
        </div>

        <h3 id="question-text" class="text-base sm:text-lg font-bold text-slate-900 leading-relaxed mb-6"></h3>

        <!-- Danh sách lựa chọn Radio / Checkbox -->
        <div id="options-container" class="space-y-3 mb-8"></div>

        <!-- Nút điều hướng -->
        <div class="flex items-center justify-between pt-4 border-t border-slate-100">
          <button id="btn-prev" onclick="navigateQuestion(-1)"
            class="px-4 py-2.5 rounded-xl border border-slate-200 text-slate-700 hover:bg-slate-50 font-semibold text-sm flex items-center gap-2 disabled:opacity-40">
            <i class="fa-solid fa-chevron-left text-xs"></i> Câu trước
          </button>

          <button id="btn-next" onclick="navigateQuestion(1)"
            class="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-sm flex items-center gap-2">
            <span>Câu tiếp theo</span> <i class="fa-solid fa-chevron-right text-xs"></i>
          </button>
        </div>
      </div>

      <!-- Bảng điều hướng câu hỏi & Nút nộp bài -->
      <div class="lg:col-span-4 bg-white rounded-2xl p-5 border border-slate-200 shadow-sm">
        <h4 class="font-bold text-slate-900 text-sm mb-3">Danh sách câu hỏi</h4>
        <div id="question-palette" class="grid grid-cols-5 gap-2 mb-5"></div>

        <button onclick="submitQuizNow()"
          class="w-full py-3 px-4 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-sm shadow-md shadow-emerald-600/20 transition flex items-center justify-center gap-2">
          <i class="fa-solid fa-paper-plane"></i>
          <span>Nộp bài & Chấm điểm ngay</span>
        </button>
      </div>
    </div>
  </main>

  <script src="js/data.js"></script>
  <script src="js/quiz.js"></script>
</body>
</html>
